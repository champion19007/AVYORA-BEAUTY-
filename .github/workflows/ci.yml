name: CI

# Tests and type checks existed but nothing ran them, so a regression could
# reach main unnoticed. This runs them on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build must succeed without secrets, which also proves the app
          # degrades rather than crashing when unconfigured.
          NODE_ENV: production
