name: CI

# Tests and type checks existed but nothing ran them, so a regression could
# reach main unnoticed. This runs them on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the Node/npm major used to generate package-lock.json.
          # A lockfile written by npm 12 is rejected by npm 10 with a
          # package.json/lockfile "out of sync" error, even though nothing is
          # actually out of sync.
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        # Prettier owns layout (.prettierrc.json); run `npm run format` to fix.
        run: npm run format:check

      - name: Tests (with coverage thresholds, see vitest.config.ts)
        run: npm run test:coverage

      - name: Dependency audit (runtime)
        # What ships to the server and browser: blocks on high and above.
        # Next's bundled postcss is overridden to the patched 8.5 line in
        # package.json, which cleared the last runtime advisory.
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit (build tools)
        # Build-time only (Tailwind 3's file watchers, eslint-config-next):
        # their remaining highs need breaking majors and never run in
        # production, so only critical blocks here.
        run: npm audit --audit-level=critical

      - name: Build
        # No database in CI: the explicit offline build, which renders the
        # catalogue-only fallbacks. This proves the app degrades rather than
        # crashing when unconfigured; the artifact is never deployed.
        run: npm run build:offline
